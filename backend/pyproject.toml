[project]
name = "finpilot-backend"
version = "0.1.0"
description = "FinPilot FastAPI backend"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injectors are designed to be called in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"alembic/*" = ["UP035", "UP007", "E501"]  # generated migration style

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = false
disallow_untyped_defs = true
ignore_missing_imports = true

# Heavy ML libraries are untyped and their transitive `transformers` version
# floats; analyzing them is slow and has crashed mypy. Skip them entirely.
[[tool.mypy.overrides]]
module = ["transformers.*", "sentence_transformers.*", "torch.*"]
follow_imports = "skip"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
