# FinPilot on Render — one-click blueprint (https://render.com/docs/blueprint-spec).
# Deploy: Render dashboard → New → Blueprint → point at this repo.
# Free tier throughout; see docs/RENDER_DEPLOY.md for the walkthrough.

databases:
  - name: finpilot-db
    plan: free
    postgresMajorVersion: "16"

services:
  # Redis-compatible key-value store (rate limits, token blacklist, cache).
  - type: keyvalue
    name: finpilot-redis
    plan: free
    ipAllowList: []  # only reachable from other Render services

  - type: web
    name: finpilot-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    # Migrations self-apply on boot; $PORT is injected by Render.
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finpilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: finpilot-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # 512 MB free instances can't hold the 90 MB embedding model + torch;
      # the copilot answers from the user's own data instead. Remove this on
      # a Starter instance to re-enable RAG retrieval.
      - key: DISABLE_EMBEDDINGS
        value: "1"
      # Set after the frontend is deployed (e.g. https://finpilot.vercel.app).
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Optional, all free — any ONE upgrades copilot answer quality.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Optional — enables "Sign in with Google".
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
